version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 8
    labels:
      - dependencies
      - gradle
    groups:
      android-lifecycle:
        patterns:
          - "androidx.lifecycle*"
      compose-bom:
        patterns:
          - "androidx.compose*"
      camerax:
        patterns:
          - "androidx.camera*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
